services:
  postgres:
    container_name: ch_postgres
    image: postgres:18-alpine
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    environment:
      POSTGRES_MULTIPLE_DATABASES: '"conference-hall","conference-hall-test"'
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    container_name: ch_redis
    image: redis:8.2-alpine
    command: redis-server --save 20 1 --loglevel warning --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  garage:
    container_name: ch_garage
    image: dxflrs/garage:v2.4.1
    command: ['/garage', 'server', '--single-node', '--default-access-key']
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    ports:
      - '3900:3900'
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: conferencehall
      GARAGE_DEFAULT_SECRET_KEY: conferencehallsecret
      RUST_LOG: warn
    healthcheck:
      test: ['CMD', '/garage', 'health']
      interval: 2s
      timeout: 5s
      retries: 30

  garage-setup:
    container_name: ch_garage_setup
    image: curlimages/curl:latest
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./docker/garage/setup.sh:/setup.sh:ro
    environment:
      GARAGE_ADMIN_TOKEN: conference-hall-local-admin-token
      GARAGE_ACCESS_KEY_ID: conferencehall
    entrypoint: ['sh', '/setup.sh']

  mailpit:
    container_name: ch_mailpit
    image: axllent/mailpit:latest
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 30
